function loop(now){if(!running||rulesPaused)return;if(!last)last=now;const dt=Math.min((now-last)/16.667,2);last=now;clock+=dt;travelSeconds+=dt/60;{const seconds=Math.floor(travelSeconds);el('elapsedTime').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}updateBiome();updateWeather(dt/60);stageFlash=Math.max(0,stageFlash-dt);biomeBlendFrames=Math.max(0,biomeBlendFrames-dt);const previousPlayerBottom=y+PH;vy+=.742*dt;y+=vy*dt;if(y>=G-PH){if(y>G-PH && combo>0)combo=0;y=G-PH;vy=0;jumps=0}for(const k in effects)effects[k]=Math.max(0,effects[k]-dt);inv=Math.max(0,inv-dt);flash=Math.max(0,flash-dt);comboFlash=Math.max(0,comboFlash-dt);const speed=(4.7+Math.min(3.22,score*.049))*(currentWeather()==='rain'?.9:currentWeather()==='dust'?1.1:1);if((effects.peace||0)<=0){enemyTimer-=dt;if(enemyTimer<=0)spawnEnemy()}coinTimer-=dt;if(coinTimer<=0)spawnCoins();recoveryTimer-=dt;if(recoveryTimer<=0)spawnRecovery();for(let i=0;i<objects.length;i++){const o=objects[i];if(o.used)continue;if(o.type==='coin'||o.type==='recovery')o.x-=speed*dt;else{if(o.type==='charger'&&!o.triggered&&o.x<400)o.triggered=true;const factor=o.type==='charger'?(o.triggered?2.3:1):o.type==='runner'?1.15:1;o.x-=speed*dt*factor;o.phase+=dt*(o.type==='hopper'?.075:o.type==='zigzag'?.055:0);if(o.type==='tracker'){const target=y+PH/2-o.h/2;o.y+=Math.max(-1.9*dt,Math.min(1.9*dt,target-o.y));o.y=Math.max(G-450,Math.min(G-o.h,o.y))}if(o.type==='splitter'&&!o.triggered&&o.x<o.splitX)split(o)}}separateCoins();for(let i=0;i<objects.length;i++){const o=objects[i];if(o.used)continue;const oy=objectY(o);if(o.type==='coin'){let touching=Math.hypot(PX+PW/2-o.x-o.w/2,y+PH/2-oy-o.h/2)<29;if(effects.magnet>0&&Math.hypot(o.x-PX,oy-y)<161)touching=true;if(touching){o.used=true;const gainedCoins=effects.double>0?2:1;coins+=gainedCoins;totalCoins+=gainedCoins;score+=2;while(coins>=10){coins-=10;award(rand(ITEMS));if(currentWeather()==='cloud'&&Math.random()<.2)award(rand(ITEMS))}}}else if(o.type==='recovery'){if(collides(o,oy)){o.used=true;lives=Math.min(3,lives+1);flash=18}}else if(collides(o,oy)){const airborne=y+PH<G-2;const enemyBottom=oy+o.h;const topHit=enemyBottom>y&&enemyBottom<=y+PH*.32&&oy<y;const stomp=airborne&&!topHit;if(stomp){o.used=true;defeated++;combo++;maxCombo=Math.max(maxCombo,combo);if(combo%5===0)lives=Math.min(3,lives+1);comboFlash=85;score+=3;y=oy-PH;vy=effects.boost>0?-17.8:-14.85;jumps=1;flash=8}else if(effects.star>0){o.used=true;defeated++;score+=3;award(rand(ITEMS))}else if(inv<=0){combo=0;if(shield){shield=false;inv=65;flash=18;o.used=true}else if(lives>0){lives--;inv=65;flash=18;o.used=true}else{draw();gameOver();return}}}if(!o.scored&&o.x+o.w<PX){o.scored=true;if(isEnemy(o))score++}}objects=objects.filter(o=>!o.used&&o.x+o.w>-50);if(score>best){best=score;try{localStorage.setItem('monster-rush-best',best)}catch(e){}}el('score').textContent=score;el('best').textContent=best;el('killCount').textContent='討伐 '+defeated;el('maxCombo').textContent='最高コンボ '+maxCombo;el('coinCount').textContent='コイン '+totalCoins;draw();raf=requestAnimationFrame(loop)}
function openRules(e){if(e)e.stopPropagation();if(running){rulesPaused=true;cancelAnimationFrame(raf)}el('rulesScroll').scrollTop=0;el('rulesModal').classList.add('open')}function closeRules(e){if(e)e.stopPropagation();el('rulesModal').classList.remove('open');if(running&&rulesPaused){rulesPaused=false;last=0;raf=requestAnimationFrame(loop)}}el('rulesOpenTop').addEventListener('click',openRules);el('rulesOpenOverlay').addEventListener('click',openRules);el('rulesClose').addEventListener('click',closeRules);el('rulesModal').addEventListener('pointerdown',e=>e.stopPropagation());el('rulesModal').addEventListener('click',e=>{if(e.target===el('rulesModal'))closeRules(e)});el('stage').addEventListener('pointerdown',e=>{if(!running)return;e.preventDefault();jump()});el('stage').addEventListener('touchmove',e=>{if(running)e.preventDefault()},{passive:false});el('start').addEventListener('click',e=>{e.stopPropagation();reset()});document.addEventListener('keydown',e=>{if(e.code==='Escape'&&el('rulesModal').classList.contains('open')){closeRules(e);return}if((e.code==='Space'||e.code==='ArrowUp')&&!rulesPaused){e.preventDefault();jump()}});draw();
})();

/* MONSTER RUSH: check latest deployed HTML on app launch/resume. */
(()=>{
const CURRENT_SHA256='95094f2c814faeda9a847f53e6ff7ec60b7ffb89c4812e4a22e7985b9d46047c';
let checking=false,lastCheck=0;
async function checkForUpdate(){
 if(checking||!navigator.onLine||Date.now()-lastCheck<15000)return;
 checking=true;lastCheck=Date.now();
 try{
  const u=new URL(location.href);u.searchParams.set('_mr_update_check',String(Date.now()));
  const response=await fetch(u.href,{cache:'no-store'});
  if(!response.ok)return;
  const html=await response.text();
  // Only compare compatible, versioned builds; avoid reloading a wrong page.
  if(!html.includes('const CURRENT_SHA256='))return;
  const normalized=html.replace(/const CURRENT_SHA256='[a-f0-9]{64}'/,"const CURRENT_SHA256='"+'0'.repeat(64)+"'");
  const data=new TextEncoder().encode(normalized);
  const digest=await crypto.subtle.digest('SHA-256',data);
  const sha=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(sha!==CURRENT_SHA256){
   // Do not interrupt an active run; update on the next launch instead.
   if(document.getElementById('overlay')?.style.display==='none')return;
   const fresh=new URL(location.href);fresh.searchParams.set('_mr_version',sha.slice(0,12));
   fresh.searchParams.delete('_mr_update_check');
   location.replace(fresh.href);
  }
 }catch(_e){}finally{checking=false}
}
window.addEventListener('pageshow',checkForUpdate);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkForUpdate()});
})();
</script></body></html>
