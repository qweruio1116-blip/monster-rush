<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#112532"><title>MONSTER RUSH</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#112532;color:#e5f7ed;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#top{display:flex;justify-content:space-between;padding:8px 16px;font-size:15px;flex:none}#stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}canvas{display:block;width:auto;height:auto;max-width:100%;max-height:100%;aspect-ratio:800/950;object-fit:contain;touch-action:none}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#07131be8;text-align:center;padding:20px}#overlay b{font-size:32px}button{border:0;border-radius:25px;background:#b8ee8a;color:#193326;font-size:17px;font-weight:800;padding:14px 38px}#tip{text-align:center;font-size:11px;padding:5px 0;opacity:.75;flex:none}@media(orientation:landscape){#tip{display:none}#top{padding:3px 14px}}</style></head><body><div id="app"><div id="top"><span>スコア <b id="score">0</b></span><span>ベスト <b id="best">0</b></span></div><div id="stage"><canvas id="cv" width="800" height="950"></canvas><div id="overlay"><b id="heading">MONSTER RUSH</b><span id="subtitle">2段ジャンプ・ストック3機・レア回復アイテム</span><button id="start">スタート</button></div></div><div id="tip">画面タップでジャンプ ／ 2回タップで2段ジャンプ</div></div><script>
(()=>{
const el=id=>document.getElementById(id),ctx=el('cv').getContext('2d');
const W=800,G=525,PX=125,PW=37,PH=42;
const TYPES=['runner','hopper','heavy','charger','diver','tracker','splitter','zigzag'];
const ITEMS=['shield','peace','boost','magnet','star','double'];
const LABEL={shield:'シールド（1回）',peace:'平和モード（6秒）',boost:'強化ジャンプ（6秒）',magnet:'磁石（6秒）',star:'スター無敵（4.5秒）',double:'コイン2倍（6秒）'};
const COLORS={runner:'#f4a46d',hopper:'#e3a3ff',heavy:'#dc7777',charger:'#ff936b',diver:'#ff7eb0',tracker:'#68d7d2',splitter:'#d2b1fa',zigzag:'#f1d16b'};
const LEVELS=[G-33,G-115,G-165],COIN_GAP=46,WAVE_GAP=170,SAFE_GAP=85;
const rand=a=>a[Math.floor(Math.random()*a.length)],between=(a,b)=>a+Math.random()*(b-a);
let y=G-PH,vy=0,jumps=0,objects=[],score=0,best=0,coins=0,lives=3,shield=false,effects={},inv=0,flash=0,clock=0,enemyTimer=40,coinTimer=50,recoveryTimer=900,last=0,raf=0,running=false;
try{best=+(localStorage.getItem('monster-rush-best')||0)}catch(e){}el('best').textContent=best;
function isEnemy(o){return !['coin','recovery'].includes(o.type)}
function add(type,x,yy,w,h,extra={}){objects.push({type,x,y:yy,w,h,phase:Math.random()*6.28,used:false,scored:false,triggered:false,...extra})}
function award(type){if(type==='shield')shield=true;else effects[type]=type==='star'?270:360}
function reset(){cancelAnimationFrame(raf);y=G-PH;vy=0;jumps=0;objects=[];score=0;coins=0;lives=3;shield=false;effects={};inv=0;flash=0;clock=0;enemyTimer=between(30,55);coinTimer=between(18,42);recoveryTimer=between(700,1300);last=0;running=true;el('score').textContent=0;el('best').textContent=best;el('overlay').style.display='none';raf=requestAnimationFrame(loop)}
function jump(){if(!running||jumps>=2)return;vy=effects.boost>0?-17.8:-14.85;jumps++}
function safeSpawnX(base,w){let x=base;for(let pass=0;pass<3;pass++){let blocked=false;for(const o of objects){if(o.used||o.x>W+240||o.x+o.w<W-80)continue;if(o.x+o.w+SAFE_GAP>x&&o.x-SAFE_GAP<x+w){x=Math.max(x,o.x+o.w+SAFE_GAP);blocked=true}}if(!blocked)break}return x<=W+240?x:null}
function spawnEnemy(){const type=rand(TYPES),specs={runner:[G-34,41,34],hopper:[G-43,39,43],heavy:[G-84,52,84],charger:[G-38,45,38],diver:[G-243,45,36],tracker:[G-155,42,39],splitter:[G-48,48,48],zigzag:[G-165,45,35]};const [yy,w,h]=specs[type],x=safeSpawnX(W+45,w);if(x===null){enemyTimer=between(12,26);return}const extra=type==='splitter'?{splitMode:Math.floor(Math.random()*4),splitX:between(340,570)}:{};add(type,x,yy,w,h,extra);const difficulty=Math.min(13,score*.04);enemyTimer=Math.random()<.18?between(35,53):between(43,132)-difficulty}
function spawnCoins(){const peace=(effects.peace||0)>0,count=peace?2+Math.floor(Math.random()*2):1+Math.floor(Math.random()*3),level=rand(LEVELS),width=(count-1)*COIN_GAP+24;const rightmost=objects.reduce((m,o)=>o.type==='coin'&&!o.used&&o.x<W+240?Math.max(m,o.x+o.w):m,-10000);const x=safeSpawnX(Math.max(W+30,Math.min(W+90,rightmost+WAVE_GAP)),width);if(x!==null)for(let i=0;i<count;i++)add('coin',x+i*COIN_GAP,level,24,24);coinTimer=peace?between(20,50):between(40,100)}
function spawnRecovery(){if(lives<3&&!objects.some(o=>o.type==='recovery'&&!o.used)){const level=rand([G-40,G-115]),x=safeSpawnX(W+45,30);if(x!==null)add('recovery',x,level,30,30)}recoveryTimer=between(850,1600)}
function split(o){o.triggered=true;if(o.splitMode===0)return;o.used=true;const x=o.x;if(o.splitMode===1){add('splitter',x,G-31,30,31,{triggered:true});add('splitter',x+62,G-31,30,31,{triggered:true})}else if(o.splitMode===2){add('splitter',x,G-31,30,31,{triggered:true});add('splitter',x+18,G-107,30,31,{triggered:true})}else{add('splitter',x,G-29,28,29,{triggered:true});add('splitter',x+49,G-73,28,29,{triggered:true});add('splitter',x+98,G-125,28,29,{triggered:true})}}
function objectY(o){if(o.type==='hopper')return G-o.h-Math.abs(Math.sin(o.phase))*60;if(o.type==='zigzag')return o.y+Math.sin(o.phase)*60;if(o.type==='diver'){const p=Math.max(0,Math.min(1,(W+45-o.x)/405));return o.y+Math.max(0,p-.22)*238}return o.y}
function collides(o,oy){const px=PX+5,py=y+5,pw=PW-10,ph=PH-10;if(['diver','tracker','zigzag'].includes(o.type)){const cx=o.x+o.w/2,cy=oy+o.h/2,rx=o.w*.39,ry=o.h*.38,nx=Math.max(px,Math.min(cx,px+pw)),ny=Math.max(py,Math.min(cy,py+ph));return ((nx-cx)/rx)**2+((ny-cy)/ry)**2<1}return px<o.x+o.w-4&&px+pw>o.x+4&&py<oy+o.h-4&&py+ph>oy+4}
function separateCoins(){for(const coin of objects){if(coin.used||coin.type!=='coin')continue;for(const enemy of objects){if(enemy.used||!isEnemy(enemy))continue;const ey=objectY(enemy);if(coin.x<enemy.x+enemy.w+10&&coin.x+coin.w>enemy.x-10&&coin.y<ey+enemy.h+10&&coin.y+coin.h>ey-10){coin.used=true;break}}}}
function hud(){const g=ctx;g.save();g.textAlign='center';g.textBaseline='middle';for(let i=0;i<3;i++){const x=347+i*53;g.globalAlpha=i<lives?1:.16;g.fillStyle='#b8ee8a';g.beginPath();g.roundRect(x,27,33,37,9);g.fill();g.fillStyle='#18352d';g.beginPath();g.arc(x+23,39,3,0,Math.PI*2);g.fill()}g.globalAlpha=1;g.font='700 23px system-ui';g.fillStyle='#ffdd80';g.fillText('COIN  '+coins+' / 10',400,104);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(90,130,620,14);g.fillStyle='#ffd66e';g.fillRect(90,130,620*coins/10,14);g.fillStyle='rgba(208,246,218,.14)';g.beginPath();g.roundRect(55,575,690,305,20);g.fill();g.strokeStyle='rgba(194,235,205,.19)';g.lineWidth=2;g.stroke();const active=[];if(shield)active.push(LABEL.shield);for(const type of ITEMS)if(type!=='shield'&&effects[type]>0)active.push(LABEL[type]);g.fillStyle='#e2f8e8';if(active.length){g.font='800 38px system-ui';active.slice(0,4).forEach((s,i)=>g.fillText(s,400,626+i*61,650));if(active.length>4){g.font='700 23px system-ui';g.fillText('ほか '+(active.length-4)+' 件の効果',400,868)}}else{g.font='800 44px system-ui';g.fillText('10コインで',400,685);g.fillText('ランダムアイテム',400,754)}g.restore()}
function draw(){const g=ctx;g.fillStyle='#112532';g.fillRect(0,0,800,950);g.fillStyle='#152e3b';for(let i=0;i<15;i++){const x=i*91-(clock*.35%91);g.beginPath();g.moveTo(x,G);g.lineTo(x+49,G-129-(i%3)*21);g.lineTo(x+126,G);g.fill()}g.fillStyle='#294e44';g.fillRect(0,G,800,425);g.fillStyle='#80b58a';g.fillRect(0,G,800,5);hud();for(const o of objects){if(o.used)continue;const x=o.x,oy=objectY(o),t=o.type;if(t==='coin'){g.fillStyle='#ffd65e';g.beginPath();g.arc(x+12,oy+12,12,0,Math.PI*2);g.fill();g.strokeStyle='#bd8525';g.lineWidth=2.5;g.stroke();continue}if(t==='recovery'){const cx=x+15,cy=oy+15;g.save();g.shadowColor='#ff8fb2';g.shadowBlur=19;g.fillStyle='#ff789e';g.beginPath();g.moveTo(cx,cy+12);g.bezierCurveTo(cx-24,cy-4,cx-13,cy-17,cx,cy-7);g.bezierCurveTo(cx+13,cy-17,cx+24,cy-4,cx,cy+12);g.fill();g.restore();g.strokeStyle='#fff2f6';g.lineWidth=2;g.stroke();continue}g.fillStyle=COLORS[t]||'#eee';g.beginPath();g.roundRect(x,oy,o.w,o.h,t==='heavy'?7:14);g.fill();if(['diver','tracker','zigzag'].includes(t)){g.beginPath();g.moveTo(x+7,oy+14);g.lineTo(x-11,oy-6+Math.sin(o.phase)*8);g.lineTo(x+21,oy+17);g.fill()}if(t==='splitter'){g.strokeStyle='#704b9e';g.lineWidth=3;g.beginPath();g.moveTo(x+o.w/2,oy+4);g.lineTo(x+o.w/2,oy+o.h-4);g.stroke()}g.fillStyle='white';g.beginPath();g.arc(x+o.w-13,oy+13,4,0,Math.PI*2);g.fill();g.fillStyle='#172d36';g.beginPath();g.arc(x+o.w-11,oy+13,2,0,Math.PI*2);g.fill()}if(shield){g.strokeStyle='#70dff5';g.lineWidth=4;g.beginPath();g.arc(PX+PW/2,y+PH/2,34,0,Math.PI*2);g.stroke()}if(effects.star>0){g.strokeStyle='#ffe476';g.lineWidth=4;g.beginPath();g.arc(PX+PW/2,y+PH/2,39,0,Math.PI*2);g.stroke()}const star=effects.star||0,blinking=(inv>0||(star>0&&star<=65))&&Math.floor(clock/5)%2===0;if(!blinking){g.fillStyle=star>0?'#ffe476':effects.boost>0?'#e6a1ff':'#b8ee8a';g.beginPath();g.roundRect(PX,y,PW,PH,10);g.fill();g.fillStyle='#18352d';g.beginPath();g.arc(PX+26,y+13,3.5,0,Math.PI*2);g.fill()}if(flash>0){g.strokeStyle='rgba(112,223,245,'+(flash/18)+')';g.lineWidth=5;g.beginPath();g.arc(PX+PW/2,y+PH/2,34+(18-flash)*2.8,0,Math.PI*2);g.stroke()}}
function gameOver(){running=false;cancelAnimationFrame(raf);el('heading').textContent='ゲームオーバー';el('subtitle').textContent='スコア '+score+' ／ ベスト '+best;el('start').textContent='もう一度';el('overlay').style.display='flex'}
function loop(now){if(!running)return;if(!last)last=now;const dt=Math.min((now-last)/16.667,2);last=now;clock+=dt;vy+=.742*dt;y+=vy*dt;if(y>=G-PH){y=G-PH;vy=0;jumps=0}for(const k in effects)effects[k]=Math.max(0,effects[k]-dt);inv=Math.max(0,inv-dt);flash=Math.max(0,flash-dt);const speed=4.7+Math.min(3.22,score*.049);if((effects.peace||0)<=0){enemyTimer-=dt;if(enemyTimer<=0)spawnEnemy()}coinTimer-=dt*(effects.peace>0?2:1);if(coinTimer<=0)spawnCoins();recoveryTimer-=dt;if(recoveryTimer<=0)spawnRecovery();for(let i=0;i<objects.length;i++){const o=objects[i];if(o.used)continue;if(o.type==='coin'||o.type==='recovery')o.x-=speed*dt;else{if(o.type==='charger'&&!o.triggered&&o.x<400)o.triggered=true;const factor=o.type==='charger'?(o.triggered?2.3:1):o.type==='runner'?1.15:1;o.x-=speed*dt*factor;o.phase+=dt*(o.type==='hopper'?.075:o.type==='zigzag'?.055:0);if(o.type==='tracker'){const target=y+PH/2-o.h/2;o.y+=Math.max(-1.9*dt,Math.min(1.9*dt,target-o.y));o.y=Math.max(G-450,Math.min(G-o.h,o.y))}if(o.type==='splitter'&&!o.triggered&&o.x<o.splitX)split(o)}}separateCoins();for(let i=0;i<objects.length;i++){const o=objects[i];if(o.used)continue;const oy=objectY(o);if(o.type==='coin'){let touching=Math.hypot(PX+PW/2-o.x-o.w/2,y+PH/2-oy-o.h/2)<29;if(effects.magnet>0&&Math.hypot(o.x-PX,oy-y)<161)touching=true;if(touching){o.used=true;coins+=effects.double>0?2:1;score+=2;while(coins>=10){coins-=10;award(rand(ITEMS))}}}else if(o.type==='recovery'){if(collides(o,oy)){o.used=true;lives=Math.min(3,lives+1);flash=18}}else if(collides(o,oy)){if(effects.star>0){o.used=true;score+=3;award(rand(ITEMS))}else if(inv<=0){if(shield){shield=false;inv=65;flash=18;o.used=true}else if(lives>0){lives--;inv=65;flash=18;o.used=true}else{draw();gameOver();return}}}if(!o.scored&&o.x+o.w<PX){o.scored=true;if(isEnemy(o))score++}}objects=objects.filter(o=>!o.used&&o.x+o.w>-50);if(score>best){best=score;try{localStorage.setItem('monster-rush-best',best)}catch(e){}}el('score').textContent=score;el('best').textContent=best;draw();raf=requestAnimationFrame(loop)}
el('stage').addEventListener('pointerdown',e=>{if(!running)return;e.preventDefault();jump()});el('stage').addEventListener('touchmove',e=>{if(running)e.preventDefault()},{passive:false});el('start').addEventListener('click',e=>{e.stopPropagation();reset()});document.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});draw();
})();
</script></body></html>
